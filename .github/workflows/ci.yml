name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke test (start hub, hit health)
        run: |
          python -m mcp_hub --host 127.0.0.1 --port 8899 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8899/admin/health; then
              echo
              exit 0
            fi
            sleep 0.5
          done
          echo "hub did not become healthy" >&2
          exit 1
