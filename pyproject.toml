[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hub"
version = "0.1.0"
description = "MCP 消息集线器：多 Agent 注册、心跳、路由与消息转发（异步 / MCP 标准协议）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "湖南五岳监控测量技术有限公司" }]
keywords = ["mcp", "model-context-protocol", "agent", "message-hub", "asyncio"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-hub = "mcp_hub.__main__:main"

[tool.setuptools.packages.find]
include = ["mcp_hub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
